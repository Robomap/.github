name: Sync Apple OAuth secrets to Azure

# Keeps Sign in with Apple credentials on robomap-backend in sync with
# GitHub Actions secrets. Required repository (or org) secrets:
#   APPLE_CLIENT_ID
#   APPLE_TEAM_ID
#   APPLE_KEY_ID
#   APPLE_PRIVATE_KEY   # PEM or bare base64 PKCS#8 body; \n escapes OK
#
# Azure auth uses GitHub OIDC against app GitHub-OIDC-Admin (no AZURE_CREDENTIALS).
# APPLE_CLIENT_SECRET is intentionally unused — the backend mints a JWT
# from APPLE_PRIVATE_KEY / TEAM_ID / KEY_ID at token-exchange time.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/sync-apple-oauth-secrets.yml'
      - 'profile/APPLE_SIGN_IN.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-apple-oauth-secrets.yml'
      - 'profile/APPLE_SIGN_IN.md'

permissions:
  contents: read

jobs:
  verify-apple-oauth:
    name: Verify production Apple OAuth
    runs-on: ubuntu-latest
    steps:
      - name: Check Apple authorize redirect
        run: |
          set -euo pipefail
          # --max-redirs 0: we only want the 302 Location, not to follow Apple.
          headers=$(curl -sSI --max-redirs 0 https://api.robomap.ai/auth/apple || true)
          loc=$(printf '%s\n' "$headers" | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2; exit}')
          echo "location=${loc}"
          test -n "$loc"
          echo "$loc" | grep -q 'appleid.apple.com/auth/authorize'
          echo "$loc" | grep -q 'client_id=ai.robomap.signin'
          echo "$loc" | grep -q 'redirect_uri=https%3A%2F%2Fapi.robomap.ai%2Fauth%2Fapple%2Fcallback'
          echo "Apple OAuth authorize redirect looks healthy."

  sync-secrets:
    name: Sync secrets to Azure
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: 970bc756-6a07-470f-9375-513b0c169719
          tenant-id: 74c8231a-7036-4b30-8938-53ed476b07a7
          subscription-id: 091160e9-bb4d-49c7-978e-033baf447f9a

      - name: Write Apple secrets onto Container App
        env:
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${APPLE_CLIENT_ID:?APPLE_CLIENT_ID GitHub secret is missing}"
          : "${APPLE_TEAM_ID:?APPLE_TEAM_ID GitHub secret is missing}"
          : "${APPLE_KEY_ID:?APPLE_KEY_ID GitHub secret is missing}"
          : "${APPLE_PRIVATE_KEY:?APPLE_PRIVATE_KEY GitHub secret is missing}"

          # Normalize newlines for ACA secret storage (multiline-safe via \\n).
          ESCAPED_KEY="${APPLE_PRIVATE_KEY//$'\r'/}"
          ESCAPED_KEY="${ESCAPED_KEY//$'\n'/\\n}"

          az containerapp secret set \
            --name robomap-backend \
            --resource-group application \
            --secrets \
              apple-client-id="$APPLE_CLIENT_ID" \
              apple-team-id="$APPLE_TEAM_ID" \
              apple-key-id="$APPLE_KEY_ID" \
              apple-private-key="$ESCAPED_KEY"

          az containerapp update \
            --name robomap-backend \
            --resource-group application \
            --set-env-vars \
              APPLE_CLIENT_ID=secretref:apple-client-id \
              APPLE_TEAM_ID=secretref:apple-team-id \
              APPLE_KEY_ID=secretref:apple-key-id \
              APPLE_PRIVATE_KEY=secretref:apple-private-key \
              APPLE_CLIENT_SECRET= \
              APPLE_REDIRECT=https://api.robomap.ai/auth/apple/callback

      - name: Verify Apple authorize redirect
        run: |
          set -euo pipefail
          headers=$(curl -sSI --max-redirs 0 https://api.robomap.ai/auth/apple || true)
          loc=$(printf '%s\n' "$headers" | tr -d '\r' | awk -F': ' 'tolower($1)=="location"{print $2; exit}')
          echo "location=${loc}"
          test -n "$loc"
          echo "$loc" | grep -q 'appleid.apple.com/auth/authorize'
          echo "$loc" | grep -q 'client_id='
