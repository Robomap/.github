resolver 127.0.0.11 ipv6=off valid=10s;

server {
  listen 8080;
  server_name _;
  client_max_body_size 50m;

  root /usr/share/nginx/html;
  absolute_redirect off;
  server_tokens off;

  proxy_hide_header X-Powered-By;
  proxy_hide_header Server;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  set $analytics_backend http://analytics-backend.internal.victoriousbush-08a428e1.francecentral.azurecontainerapps.io;
  set $analytics_client http://analytics-client.internal.victoriousbush-08a428e1.francecentral.azurecontainerapps.io;

  location = /login {
    try_files /login.html =404;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
  location = /signup {
    try_files /signup.html =404;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
  location = /auth/oauth-callback {
    try_files /oauth-callback.html =404;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }
  location = /register { return 302 /signup; }
  location = /auth/login { return 302 /login; }
  location = /auth/register { return 302 /signup; }
  location = /auth/signup { return 302 /signup; }

  location /auth-ui/ {
    alias /usr/share/nginx/html/auth-ui/;
    add_header Cache-Control "public, max-age=300";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location /api/ {
    proxy_pass $analytics_backend;
    proxy_http_version 1.1;
    proxy_set_header Host analytics-backend.internal.victoriousbush-08a428e1.francecentral.azurecontainerapps.io;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Origin https://analytics.robomap.ai;
    proxy_buffering off;
  }

  location / {
    proxy_pass $analytics_client;
    proxy_http_version 1.1;
    proxy_set_header Host analytics-client.internal.victoriousbush-08a428e1.francecentral.azurecontainerapps.io;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
